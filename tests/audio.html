<!doctype html><meta charset="utf-8"><title>Rain audio checks</title>
<pre id="result">RUNNING</pre>
<iframe id="preview" style="width:390px;height:844px;border:0" src="../index.html"></iframe>
<script type="module">
const results=[];
const output=document.querySelector('#result');
function check(ok,label) { if(!ok) throw new Error(label); results.push('PASS '+label); output.textContent=results.join('\n'); }
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try {
  const frame=document.querySelector('#preview');
  await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  const win=frame.contentWindow, doc=frame.contentDocument;
  const audio=doc.querySelector('#ambient-rain'), button=doc.querySelector('#sound-toggle');
  check(doc.querySelectorAll('audio').length===1,'one rain track only');
  check(audio.getAttribute('src')==='./assets/misty_soft_rain_ambient.mp3','new local rain asset');
  check(audio.loop && !audio.autoplay && audio.paused,'loop enabled without autoplay');
  check(!doc.querySelector('.identity').textContent.includes('Between air & water.'),'subtitle removed from DOM');
  check(doc.querySelector('.brand-logo').getAttribute('src')==='./assets/logo.png','logo preserved');
  check(button.getBoundingClientRect().width===30 && button.getBoundingClientRect().height===30,'30px music button');
  check(!doc.querySelector('.controls'),'no parameter panel');
  // Decode the supplied real MP3, without playing it.
  await new Promise((resolve,reject)=> {
    audio.addEventListener('loadedmetadata',resolve,{once:true});
    audio.addEventListener('error',()=>reject(new Error('MP3 decode failed')),{once:true});
    audio.load();
  });
  check(Number.isFinite(audio.duration) && audio.duration>0,'actual MP3 metadata decodes');
  // Controlled audio clock verifies fades/races without emitting test sound.
  const ramps=[]; let sources=0, plays=0, pauses=0;
  const clock={currentTime:0};
  win.AudioContext=class {
    constructor() { return Object.assign(clock,{
      destination:{}, resume:()=>Promise.resolve(),
      createGain:()=>({gain:{value:0,cancelScheduledValues(){},setValueAtTime(v,t){ramps.push(['set',v,t]);},linearRampToValueAtTime(v,t){ramps.push(['ramp',v,t]);}},connect(){return this;}}),
      createMediaElementSource:()=>{sources++;return {connect(g){return g;}};},
    }); }
  };
  audio.play=()=>{plays++;return Promise.resolve();};
  audio.pause=()=>{pauses++;};
  button.click(); await wait(10);
  check(plays===1 && sources===1 && button.getAttribute('aria-pressed')==='true','click starts single source');
  check(ramps.some(r=>r[0]==='ramp' && r[1]===.15 && r[2]===2),'two-second fade to 15 percent');
  clock.currentTime=1; button.click();
  check(ramps.some(r=>r[0]==='set' && Math.abs(r[1]-.075)<.00001),'pause continues smoothly from current gain');
  check(ramps.at(-1)[1]===0 && ramps.at(-1)[2]===3 && pauses===0,'pause fades to zero before stopping');
  clock.currentTime=1.5; button.click(); await wait(10);
  await wait(2050);
  check(pauses===0 && sources===1 && plays===2,'rapid resume cancels pending pause and reuses source');
  button.click(); await wait(2050);
  check(pauses===1 && button.getAttribute('aria-pressed')==='false','pause stops after fade');
  let finish;
  audio.play=()=>new Promise(resolve=>{finish=resolve;});
  button.click(); button.click(); await wait(2050); finish(); await wait(10);
  check(pauses>=2 && button.getAttribute('aria-pressed')==='false','late play completion cannot restart paused rain');
  output.textContent=results.join('\n')+'\nALL CHECKS PASSED';
} catch(error) { output.textContent=results.join('\n')+'\nFAIL '+error.stack; }
</script>
